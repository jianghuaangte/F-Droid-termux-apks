name: Sync Termux APKs

on:
  schedule:
    - cron: "0 3 * * *"  # 每天凌晨3点 UTC+0
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout
      - uses: actions/checkout@v4

      # 2️⃣ 安装工具 jq 和 wget
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y jq wget gh

      # 3️⃣ 运行 release-please 创建 release/tag
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.JIANG_PAT_TOKEN }}
          release-type: simple

      # 4️⃣ 下载 Termux APKs
      - name: Download Termux APKs
        run: |
          mkdir -p .github/apks
          packages="com.termux com.termux.gui com.termux.styling com.termux.window com.termux.widget com.termux.api com.termux.boot com.termux.tasker"
          for pkg in $packages; do
            echo "Processing $pkg ..."
            json=$(curl -s "https://f-droid.org/api/v1/packages/$pkg")
            version=$(echo "$json" | jq -r '.suggestedVersionCode')
            if [ "$version" = "null" ]; then
              echo "No suggestedVersionCode for $pkg, skipping."
              continue
            fi
            url="https://f-droid.org/repo/${pkg}_${version}.apk"
            echo "Downloading $url ..."
            wget -q -O ".github/apks/${pkg}_${version}.apk" "$url"
          done

      # 5️⃣ 上传 APKs 到刚创建的 Release
      - name: Upload APKs to Release
        if: ${{ steps.release.outputs.release_created }}
        run: |
          echo "Uploading APKs to release ${{ steps.release.outputs.tag_name }} ..."
          for apk in .github/apks/*.apk; do
            gh release upload ${{ steps.release.outputs.tag_name }} "$apk" --clobber
          done
        env:
          GH_TOKEN: ${{ secrets.JIANG_PAT_TOKEN }}
